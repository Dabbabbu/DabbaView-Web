name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 클라우드 API 키는 빌드에 넣지 않는다 (각 사용자가 앱의 설정 창에서 입력)
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Version
        run: echo "Building DabbaView Web v$(node -p "require('./package.json').version")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # 배포된 주소를 실행 요약과 알림에 표시 (DabbaView 앱의 Deploy Web이 이 주소를 보여줌)
      - name: Deployed URL
        run: |
          echo "### Deployed: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Deployed::${{ steps.deployment.outputs.page_url }}"
